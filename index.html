<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M3 Beverage Mayora</title>
  <meta name="theme-color" content="#0a0b0d" />
  <meta name="description" content="Validasi kunjungan salesman dan coverage produk M3 Beverage Mayora — diproses sepenuhnya di browser, tanpa server." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=74" />
  <link rel="stylesheet" href="print.css?v=74" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23c8102e'/%3E%3Ctext x='50' y='62' font-size='34' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EM3%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">M3</div>
      <h1>M3 &mdash; Beverage Mayora</h1>
    </div>
  </header>

  <main>

    <!-- ============ STEP 1: UPLOAD ============ -->
    <section class="card upload-card" id="uploadCard">
      <div class="up-head">
        <h2>Pilih file</h2>
        <p class="up-hint">Data diproses di browser Anda. Tidak ada yang dikirim ke server.</p>
        <p class="up-hint tip">File dari WhatsApp sering tidak muncul di daftar pilihan HP.
          Salin dulu ke folder <b>Download</b>, baru dipilih dari sini.</p>
      </div>

      <div class="filelist">
        <label class="frow" id="rowEdi">
          <input type="file" id="ediFile" accept="*/*" multiple />
          <span class="fmark"></span>
          <span class="fmain">
            <b>EDI Flag Radius</b>
            <i class="ftag">Validasi kunjungan</i>
            <span class="fhint">Boleh beberapa file &mdash; satu per cabang. Tekan Pilih berkali-kali untuk menambah</span>
            <span class="fname" id="ediName">Belum dipilih</span>
            <button type="button" class="fclear hidden" id="ediClear">Kosongkan</button>
          </span>
          <span class="fbtn">Pilih</span>
        </label>

        <label class="frow" id="rowHht">
          <input type="file" id="hhtFile" accept="*/*" multiple />
          <span class="fmark"></span>
          <span class="fmain">
            <b>HHT / Scan</b>
            <i class="ftag">Validasi kunjungan</i>
            <span class="fhint">Excel, CSV, atau PDF &mdash; boleh beberapa file, tekan Pilih berkali-kali untuk menambah</span>
            <span class="fname" id="hhtName">Belum dipilih</span>
            <button type="button" class="fclear hidden" id="hhtClear">Kosongkan</button>
          </span>
          <span class="fbtn">Pilih</span>
        </label>

        <label class="frow" id="rowDmp">
          <input type="file" id="dmpFile" accept="*/*" multiple />
          <span class="fmark"></span>
          <span class="fmain">
            <b>Master Data DMP</b>
            <i class="ftag both">Keduanya</i>
            <span class="fhint">Boleh beberapa file &mdash; satu per cabang. Tekan Pilih berkali-kali untuk menambah</span>
            <span class="fname" id="dmpName">Belum dipilih</span>
            <button type="button" class="fclear hidden" id="dmpClear">Kosongkan</button>
          </span>
          <span class="fbtn">Pilih</span>
        </label>

        <label class="frow" id="rowLbp">
          <input type="file" id="lbpFile" accept="*/*" multiple />
          <span class="fmark"></span>
          <span class="fmain">
            <b>LBP &mdash; Laporan Penjualan</b>
            <i class="ftag two">Coverage produk</i>
            <span class="fhint">Boleh beberapa file &mdash; satu per cabang. Tekan Pilih berkali-kali untuk menambah</span>
            <span class="fname" id="lbpName">Belum dipilih</span>
            <button type="button" class="fclear hidden" id="lbpClear">Kosongkan</button>
          </span>
          <span class="fbtn">Pilih</span>
        </label>
      </div>

      <div class="actions">
        <button id="processBtn" class="big" disabled>Proses</button>
        <button id="resetBtn" class="ghost">Reset</button>
        <span id="status" class="status"></span>
      </div>
      <div class="errbox hidden" id="errBox"></div>
    </section>

    <!-- Compact strip shown after processing -->
    <div class="loaded-bar hidden" id="loadedBar">
      <span class="lb-files" id="lbFiles"></span>
      <span class="lb-status" id="lbStatus"></span>
      <button class="ghost sm" id="changeFilesBtn">Ganti file</button>
    </div>

    <!-- ============ STEP 2: HASIL ============ -->
    <nav class="tabs hidden" id="tabs" role="tablist">
      <div class="tabs-inner">
        <button class="tab active" id="tab1" role="tab" aria-selected="true">Validasi Kunjungan</button>
        <button class="tab" id="tab2" role="tab" aria-selected="false">Coverage Produk</button>
      </div>
    </nav>

    <!-- ===== Dashboard 1 ===== -->
    <div id="dash1" role="tabpanel">
      <section class="card hidden" id="resultSection">
        <div class="warnbox hidden" id="d1Warn"></div>
        <div class="sec-head">
          <h2>Ringkasan</h2>
          <button class="linkbtn" id="helpD1Btn">Arti kategori</button>
        </div>
        <div class="summary" id="summary"></div>
